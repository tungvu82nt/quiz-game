# Netlify Build Configuration
# Disable auto-install of extensions

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # Disable auto-install extensions
  NETLIFY_PLUGINS_AUTO_INSTALL = "false"

# Redirects cho SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
